mcp:
  description: Run the PiChat test suites in this Emacs repository.
  tools:
    - name: test
      description: Run the PiChat ERT test suite.
      params:
        integration:
          type: boolean
          description: Include RPC integration tests
          default: false
      run:
        command: 'pichat/test/run-tests.sh{{ if .integration }} --full{{ end }} 2>&1'
        timeout: 10m
